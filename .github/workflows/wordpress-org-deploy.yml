name: Deploy to WordPress.org

# ─────────────────────────────────────────────────────────────────────────────
# PREREQUISITES (read before relying on this workflow)
#
# 1. The theme must ALREADY be approved and live in the WordPress.org theme
#    directory. The FIRST version cannot be deployed this way — submit the
#    initial ZIP manually at https://wordpress.org/themes/upload/ and wait for
#    the human review to pass. Generate that ZIP with `npm run package`.
#
# 2. Add two repository secrets (Settings → Secrets and variables → Actions):
#       SVN_USERNAME  → your WordPress.org account username
#       SVN_PASSWORD  → your WordPress.org account password
#
# 3. Each release needs a UNIQUE version. Bump `Version:` in style.css, then
#    tag the commit with the matching version prefixed by `v`, e.g.:
#       style.css  →  Version: 1.0.1
#       git tag v1.0.1 && git push --tags
#    The SVN version folder is derived from style.css (the `v` is stripped),
#    so the tag and header stay in sync.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy tag to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from style.css
        id: meta
        run: |
          VERSION="$(grep -i '^[[:space:]]*Version:' style.css | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Theme version (style.css): $VERSION"

      - name: Verify tag matches style.css version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match style.css Version '${{ steps.meta.outputs.version }}'. Bump style.css and re-tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & build block assets
        run: |
          npm ci
          npm run build

      - name: Deploy to WordPress.org themes SVN
        # Pinned to Codeinwp/action-wordpress-theme-deploy v1.0
        uses: Codeinwp/action-wordpress-theme-deploy@a4595f072f3ff78318cfa43838ce85ac25507378
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: contact-sheet
          VERSION: ${{ steps.meta.outputs.version }}
